# Fork-only testing channel; platform packaging matches upstream release.yml.
name: cliff testing release

on:
  push:
    branches: [codex/cliff-rocks-dev-build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cliff-testing-release
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'Austint30/BeamNG.Earth'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: 'true'
      publish: 'true'
      dev: 'true'
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "version=$v.cliffs.dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-22.04          # an older glibc: the AppImage runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - name: Development build's version
        if: needs.check.outputs.dev == 'true'
        run: printf '%s\n' "${{ needs.check.outputs.version }}" > VERSION
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust kernels
        run: python tools/build_native.py
      - name: Grass patch (tools/gcpatch)
        run: sh tools/gcpatch/build.sh
      - name: Python packages
        run: python -m pip install pyinstaller -r server/requirements.txt
      - name: Cliff regression tests
        env:
          BNGE_ROADGEO_REAL: "0"
        run: |
          python -m pip install opencv-python-headless
          PYTHONPATH=server:server/tests python -m unittest server.tests.test_cliffcuts server.tests.test_cliffrocks server.tests.test_cliffdecals server.tests.test_clifftalus server.tests.test_cdae server.tests.test_roadgeo server.tests.test_clifflod server.tests.test_cliffdetail server.tests.test_canyon_pbr server.tests.test_farcliffs server.tests.test_far_photo_shadows server.tests.test_graphics server.tests.test_matslots server.tests.test_protocol_agreement
      - name: appimagetool
        run: |
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mv appimagetool appimagetool.AppImage
      - name: Build the AppImage
        run: python tools/build_app.py --appimagetool "$PWD/appimagetool.AppImage"
      - name: Smoke test (the packaged server starts and answers --help)
        run: |
          f=$(ls dist/*.AppImage)
          "$f" --appimage-extract-and-run --server --help > help.txt && head -3 help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Development build's version
        if: needs.check.outputs.dev == 'true'
        shell: bash
        run: printf '%s\n' "${{ needs.check.outputs.version }}" > VERSION
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust kernels
        run: python tools/build_native.py
      - name: Python packages
        run: python -m pip install pyinstaller -r server/requirements.txt
      # PyInstaller's bootloader compiled here (MSVC) instead of the wheel's prebuilt one that antivirus heuristics
      # know (VirusTotal 2026-10-17: 2/60 on 1.4.35); build_app.py stops without it
      - name: Bootloader from source
        run: python tools/build_bootloader.py
      - name: Build the .exe
        run: python tools/build_app.py --require-own-bootloader
      - name: Smoke test (the packaged server starts and answers --help)
        shell: bash
        run: |
          f=$(ls dist/*.exe)
          "$f" --server --help > help.txt && head -3 help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Package and publish cliff testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.check.outputs.version }}
        run: |
          printf '%s\n' "$BUILD_VERSION" > VERSION
          python3 tools/package.py --beammp
          python3 tools/cliff_release_notes.py "$BUILD_VERSION" "$GITHUB_SHA" > notes.md
          gh release create "v$BUILD_VERSION" out/linux/* out/windows/* dist/BeamNG.Earth-BeamMP-Server-*.zip \
            --target "$GITHUB_SHA" --title "BeamNG.Earth $BUILD_VERSION (cliff rocks testing)" \
            --notes-file notes.md --prerelease --latest=false
